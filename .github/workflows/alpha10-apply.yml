name: Apply Alpha 10 Source Patch

on:
  push:
    branches:
      - feature/alpha10-performance-editing
    paths:
      - scripts/alpha10_patch.py
      - .github/workflows/alpha10-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply alpha 10 patch
        run: python3 scripts/alpha10_patch.py
      - name: Commit generated alpha 10 source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/GgdDrumEditorAlpha10.cpp src/GgdDrumEditor.h src/GgdLibraryBrowser.cpp src/GgdLibraryBrowser.h CMakeLists.txt
          if git diff --cached --quiet; then
            echo "Alpha 10 source already current"
            exit 0
          fi
          git commit -m "Implement alpha 10 performance editing UX"
          git push
