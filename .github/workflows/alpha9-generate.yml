name: Generate Alpha 9 Editor

on:
  push:
    branches:
      - feature/alpha9-workflow-browser

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate alpha 9 editor
        run: python3 scripts/alpha9_patch.py
      - name: Commit generated source
        shell: bash
        run: |
          if git diff --quiet -- src/GgdDrumEditorAlpha9.cpp CMakeLists.txt; then
            echo "Generated source already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/GgdDrumEditorAlpha9.cpp CMakeLists.txt
          git commit -m "Generate alpha 9 editor source"
          git push
