name: Apply alpha8 source migration

on:
  push:
    branches:
      - feature/alpha8-capacity-groove-import
    paths:
      - tools/apply_alpha8.py
      - .github/workflows/apply-alpha8.yml

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize generator expectations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/apply_alpha8.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace("'#define SEQ_MAX_STEPS 256'", "'#define SEQ_MAX_STEPS         256'")
          s = s.replace("'#define SEQ_MAX_STEPS 1024'", "'#define SEQ_MAX_STEPS         1024'")
          s = s.replace("'#define SEQ_DEFAULT_NUM_STEPS 16'", "'#define SEQ_DEFAULT_NUM_STEPS 16 // this is also max steps per measure and steps per visible page'")
          s = s.replace("'#define SEQ_DEFAULT_NUM_STEPS 16\\n#define SEQ_MAX_STEPS_PER_MEASURE 32'", "'#define SEQ_DEFAULT_NUM_STEPS 16 // this is also max steps per measure and steps per visible page\\n#define SEQ_MAX_STEPS_PER_MEASURE 32'")
          p.write_text(s, encoding='utf-8')
          PY
      - name: Apply migration
        run: python tools/apply_alpha8.py
      - name: Commit generated implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Alpha 8: expand sequence capacity and rebuild GGD import"
          git push
