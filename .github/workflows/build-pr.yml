name: Build Windows CLAP (PR)

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SCCACHE_GHA_ENABLED: "true"
  # JUCE bootstraps juceaide as a Debug Ninja build. /Z7 keeps debug info in
  # each object instead of sharing a compiler PDB, which avoids MSVC PDB races
  # and makes those compilations cache-friendly.
  _CL_: "/Z7"

jobs:
  build-windows-clap:
    name: Windows CLAP
    runs-on: windows-2025

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up MSVC command line
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64

      - name: Set up compiler cache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Configure
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DSTOCHAS_VERSION="$version" `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build CLAP
        shell: pwsh
        run: cmake --build build --target stochas_CLAP --parallel

      - name: Stage packages
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          Copy-Item "build/stochas_artefacts/Release/CLAP/Stochas GGD.clap" "artifact/Stochas GGD.clap"
          Compress-Archive -Path "artifact/Stochas GGD.clap" -DestinationPath "artifact/Stochas-GGD-Windows.zip" -Force
          Get-ChildItem artifact

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: stochas-ggd-windows-clap-pr-${{ github.event.pull_request.number || 'manual' }}-${{ github.run_number }}
          path: |
            artifact/Stochas GGD.clap
            artifact/Stochas-GGD-Windows.zip
          if-no-files-found: error
          retention-days: 7

      - name: Publish PR development build
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $short = $env:HEAD_SHA.Substring(0, 7)
          $tag = "pr-$($env:PR_NUMBER)-build-$($env:GITHUB_RUN_NUMBER)-$short"
          $title = "Stochas GGD PR #$($env:PR_NUMBER) build $($env:GITHUB_RUN_NUMBER) ($short)"
          $notes = "Automatic development build from PR #$env:PR_NUMBER.`n`nHead commit: $env:HEAD_SHA`nWindows CLAP build for testing. Development builds are prereleases and may be unstable."

          if (-not (gh release view $tag 2>$null)) {
            gh release create $tag `
              --target $env:HEAD_SHA `
              --title $title `
              --prerelease `
              --notes $notes
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          gh release upload $tag `
            "artifact/Stochas GGD.clap" `
            "artifact/Stochas-GGD-Windows.zip" `
            --clobber
