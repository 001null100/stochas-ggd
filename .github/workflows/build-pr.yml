name: Build Windows CLAP (PR)

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-clap:
    name: Windows CLAP
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: |
          cmake -B build -A x64 \
            -DSTOCHAS_VERSION="$(cat VERSION)" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build CLAP
        run: cmake --build build --config Release --target stochas_CLAP --parallel

      - name: Stage artifact
        run: |
          mkdir -p artifact
          cp "build/stochas_artefacts/Release/CLAP/Stochas GGD.clap" "artifact/Stochas GGD.clap"
          ls -lah artifact

      - name: Upload CLAP
        uses: actions/upload-artifact@v4
        with:
          name: stochas-ggd-windows-clap
          path: artifact/Stochas GGD.clap
          if-no-files-found: error
