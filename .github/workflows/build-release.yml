name: Build & Release Windows CLAP

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  SCCACHE_GHA_ENABLED: "true"
  _CL_: "/Z7"

jobs:
  build-windows-clap:
    name: Windows CLAP
    runs-on: windows-2025

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Resolve release version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $tag = $env:GITHUB_REF_NAME
            $publish = 'true'
          }
          else {
            $tag = (Get-Content RELEASE_VERSION -Raw).Trim()
            if ([string]::IsNullOrWhiteSpace($tag) -or -not $tag.StartsWith('v')) {
              throw 'RELEASE_VERSION must contain a version tag beginning with v'
            }
            gh release view $tag *> $null
            $publish = if ($LASTEXITCODE -eq 0) { 'false' } else { 'true' }
          }

          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SHOULD_PUBLISH=$publish" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up MSVC command line
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64

      - name: Set up compiler cache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Configure
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DSTOCHAS_VERSION="$version" `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build CLAP
        shell: pwsh
        run: cmake --build build --target stochas_CLAP --parallel

      - name: Stage release package
        shell: pwsh
        run: |
          $archiveName = "Stochas-GGD-$env:RELEASE_TAG-Windows-x64.zip"

          New-Item -ItemType Directory -Force artifact/package | Out-Null
          Copy-Item "build/stochas_artefacts/Release/CLAP/Stochas GGD.clap" "artifact/package/Stochas GGD.clap"
          Copy-Item "build/stochas_artefacts/Release/CLAP/Stochas GGD.clap" "artifact/Stochas.GGD.clap"
          Copy-Item "COPYING" "artifact/package/LICENSE.txt"

          @"
          Stochas GGD $env:RELEASE_TAG
          Windows x64 CLAP

          INSTALL
          Copy "Stochas GGD.clap" to:
          C:\Program Files\Common Files\CLAP\

          Then rescan CLAP plug-ins in your DAW if necessary.

          This project is distributed under GPL-3.0. See LICENSE.txt.
          "@ | Set-Content -Encoding UTF8 "artifact/package/INSTALL.txt"

          Compress-Archive -Path "artifact/package/*" -DestinationPath "artifact/$archiveName" -Force
          "ARCHIVE_NAME=$archiveName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Get-ChildItem artifact

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: stochas-ggd-${{ env.RELEASE_TAG }}-windows-x64
          path: |
            artifact/Stochas.GGD.clap
            artifact/${{ env.ARCHIVE_NAME }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish versioned release
        if: env.SHOULD_PUBLISH == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:RELEASE_TAG
          $args = @(
            'release', 'create', $tag,
            '--title', "Stochas GGD $tag",
            '--generate-notes'
          )

          if ($env:GITHUB_REF -notlike 'refs/tags/*') {
            $args += @('--target', $env:GITHUB_SHA)
          }
          else {
            $args += '--verify-tag'
          }

          if ($tag -match '-') {
            $args += '--prerelease'
          }

          & gh @args
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          gh release upload $tag `
            "artifact/Stochas.GGD.clap" `
            "artifact/$env:ARCHIVE_NAME" `
            --clobber
